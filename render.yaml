# Reviewed deployment option. Creating this service/disk incurs hosting charges.
services:
  - type: web
    name: wine-purchasing-engine
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run engine
    healthCheckPath: /
    disk:
      name: wine-history
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: WINE_API_HOST
        value: 0.0.0.0
      - key: WINE_API_PORT
        value: 10000
      - key: WINE_DB_FILE
        value: /var/data/wine-engine.sqlite
      - key: WINE_ALLOWED_ORIGINS
        value: https://sta2014.github.io
      - key: ENGINE_ACCESS_TOKEN
        generateValue: true
